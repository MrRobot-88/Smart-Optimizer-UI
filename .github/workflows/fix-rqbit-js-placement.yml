name: Fix rqbit JS placement

on:
  push:
    branches: [fix-rqbit-labels-client-ui]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-rqbit-labels-client-ui
      - name: Apply JS placement fix
        run: python3 .github/scripts/fix-rqbit-js-placement.py
      - name: Compile Python
        run: python3 -m py_compile smart-optimizer-ui.py
      - name: Verify placement and label policy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('smart-optimizer-ui.py').read_text()
          script='''<script>\n(function(){\n  const select = document.querySelector('select[name="selected"]');'''
          if s.count(script) != 1:
              raise SystemExit('expected exactly one downloader toggle script')
          downloader=s.index('downloader_card = """')
          script_pos=s.index(script)
          auth=s.index('auth_card = """')
          if not (downloader < script_pos < auth):
              raise SystemExit('toggle script is not inside downloader card')
          if '"label": cfg["torrentleech_label"]' not in s:
              raise SystemExit('TorrentLeech label policy missing')
          if 'cfg["radarr_label"] if app == "radarr" else cfg["sonarr_label"]' not in s:
              raise SystemExit('Radarr/Sonarr label policy missing')
          print('placement/policy checks OK')
          PY
      - name: Diff check
        run: git diff --check
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add smart-optimizer-ui.py
          if ! git diff --cached --quiet; then
            git commit -m 'Place downloader toggle script in downloader card'
            git push origin fix-rqbit-labels-client-ui
          fi
