name: Apply rqbit label and client UI fix

on:
  push:
    branches: [fix-rqbit-labels-client-ui]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-rqbit-labels-client-ui

      - name: Apply patch
        run: python3 .github/scripts/apply-rqbit-label-ui.py

      - name: Compile Python
        run: |
          python3 -m py_compile smart-optimizer-ui.py
          python3 -m py_compile sonarr-smart-optimizer.py
          python3 -m py_compile radarr-smart-optimizer.py
          python3 -m py_compile sonarr_api_compat.py

      - name: Static checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('smart-optimizer-ui.py').read_text()
          required = [
              '"torrentleech_label": str(rqbit.get("torrentleech_label") or "torrentleech")',
              '"radarr_label": str(rqbit.get("radarr_label") or "radarr")',
              '"sonarr_label": str(rqbit.get("sonarr_label") or "sonarr")',
              '"label": cfg["torrentleech_label"]',
              'cfg["radarr_label"] if app == "radarr" else cfg["sonarr_label"]',
              'id="rqbit-settings-block"',
              'id="deluge-settings-block"',
              "select.addEventListener('change', syncClientFields)",
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('missing: ' + repr(missing))
          forbidden = [
              'name="rqbit_movie_label"',
              'name="rqbit_tv_label"',
              'name="rqbit_other_movie_label"',
              'name="rqbit_other_tv_label"',
          ]
          bad = [x for x in forbidden if x in s]
          if bad:
              raise SystemExit('old UI fields remain: ' + repr(bad))
          print('rqbit label/UI checks OK')
          PY

      - name: Diff check
        run: git diff --check

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add smart-optimizer-ui.py
          if git diff --cached --quiet; then
            echo 'No code changes to commit'
          else
            git commit -m 'Fix rqbit labels and selected-client settings UI'
            git push origin fix-rqbit-labels-client-ui
          fi
