name: Synology Native Offline SPK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native-spk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Choose package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              VERSION="${GITHUB_REF_NAME#v}"
          else
              VERSION="2.2.4"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Smart Optimizer UI $VERSION"

      - name: Install icon build dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check "Pillow==11.3.0"

      - name: Download portable native Python runtime
        shell: bash
        run: |
          set -euo pipefail
          URL='https://github.com/astral-sh/python-build-standalone/releases/download/20260924/cpython-3.12.14%2B20260924-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz'
          curl -fL --retry 4 --retry-delay 3 "$URL" -o portable-python.tar.gz
          echo '269b2c99e4db15b242bf01832f4fea1e8f1a664f273cff519393f296e9820b41  portable-python.tar.gz' | sha256sum -c -

      - name: Build application update bundle
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.version.outputs.value }}'

          rm -rf app-bundle-stage
          mkdir -p app-bundle-stage/app dist

          cp -p smart-optimizer-ui.py app-bundle-stage/app/
          cp -p radarr-smart-optimizer.py app-bundle-stage/app/
          cp -p sonarr-smart-optimizer.py app-bundle-stage/app/
          cp -a assets app-bundle-stage/app/assets

          sed -i \
            's/const SMART_ADMIN_DEVELOPMENT_BUILD = true;/const SMART_ADMIN_DEVELOPMENT_BUILD = false;/' \
            app-bundle-stage/app/assets/fragments/admin-update-mode.html

          grep -q \
            'const SMART_ADMIN_DEVELOPMENT_BUILD = false;' \
            app-bundle-stage/app/assets/fragments/admin-update-mode.html

          python3 -m py_compile \
            app-bundle-stage/app/smart-optimizer-ui.py \
            app-bundle-stage/app/radarr-smart-optimizer.py \
            app-bundle-stage/app/sonarr-smart-optimizer.py

          find app-bundle-stage -type d -name __pycache__ -prune -exec rm -rf {} +

          tar -C app-bundle-stage -czf \
            "dist/SmartOptimizerUI-App-${VERSION}.tar.gz" \
            app

      - name: Validate application update bundle
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.version.outputs.value }}'
          BUNDLE="dist/SmartOptimizerUI-App-${VERSION}.tar.gz"

          test -s "$BUNDLE"

          rm -rf verify-app
          mkdir verify-app
          tar -xzf "$BUNDLE" -C verify-app

          test -f verify-app/app/smart-optimizer-ui.py
          test -f verify-app/app/radarr-smart-optimizer.py
          test -f verify-app/app/sonarr-smart-optimizer.py
          test -d verify-app/app/assets

          grep -q \
            'const SMART_ADMIN_DEVELOPMENT_BUILD = false;' \
            verify-app/app/assets/fragments/admin-update-mode.html

          if find verify-app/app \
            \( -name 'smart-optimizer-control.json' \
               -o -name 'smart-optimizer-connections.json' \
               -o -name 'smart-optimizer-auth.json' \
               -o -name '*state*.json' \) \
            -print | grep -q .
          then
              echo "ERROR: private runtime/config file found in app update bundle."
              exit 1
          fi

          python3 -m py_compile \
            verify-app/app/smart-optimizer-ui.py \
            verify-app/app/radarr-smart-optimizer.py \
            verify-app/app/sonarr-smart-optimizer.py

      - name: Build native offline SPK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./packaging/synology/build-spk.sh
          VERSION='${{ steps.version.outputs.value }}' \
          PORTABLE_PYTHON_ARCHIVE="$PWD/portable-python.tar.gz" \
          ./packaging/synology/build-spk.sh "$PWD/dist"

      - name: Validate native package
        shell: bash
        run: |
          set -euo pipefail
          SPK="$(find dist -maxdepth 1 -type f -name '*.spk' -print -quit)"
          test -n "$SPK"

          BYTES="$(wc -c < "$SPK")"
          echo "SPK size: $BYTES"
          test "$BYTES" -gt 20000000

          mkdir verify
          tar -xf "$SPK" -C verify

          for ITEM in               INFO               package.tgz               scripts/start-stop-status               conf/privilege               PACKAGE_ICON.PNG               PACKAGE_ICON_256.PNG
          do
              test -e "verify/$ITEM"
          done

          mkdir verify/payload
          tar -xzf verify/package.tgz -C verify/payload

          test -x verify/payload/runtime/python/bin/python3
          test -f verify/payload/smart-optimizer-supervisor.py
          test -f verify/payload/app/smart-optimizer-ui.py
          test -f verify/payload/app/radarr-smart-optimizer.py
          test -f verify/payload/app/sonarr-smart-optimizer.py
          test -f verify/payload/app/assets/home-background.png
          test -f verify/payload/app/assets/radarr-background.png
          test -f verify/payload/app/assets/sonarr-background.png
          test -f verify/payload/app/assets/radarr-icon.png
          test -f verify/payload/app/assets/sonarr-icon.png
          test -f verify/payload/app/assets/settings-icon.png
          test -f verify/payload/app/assets/smart-optimizer-logo.png
          test -f verify/payload/app/assets/smart-optimizer-logo-web.png
          test -f verify/payload/app/assets/pixel32.png
          test -f verify/payload/app/assets/fragments/update-status-favicon.html
          test -f verify/payload/app/assets/fragments/admin-update-mode.html

          grep -q \
            'const SMART_ADMIN_DEVELOPMENT_BUILD = false;' \
            verify/payload/app/assets/fragments/admin-update-mode.html

          grep -q \
            'def verified_update_file():' \
            verify/payload/app/smart-optimizer-ui.py

          grep -q \
            '/update-package-file' \
            verify/payload/app/smart-optimizer-ui.py

          if grep -q \
            'The updater will continue automatically.' \
            verify/payload/app/smart-optimizer-ui.py
          then
              echo "ERROR: packaged UI still claims automatic self-installation."
              exit 1
          fi

          if grep -q \
            'const SMART_ADMIN_DEVELOPMENT_BUILD = true;' \
            verify/payload/app/assets/fragments/admin-update-mode.html
          then
              echo "ERROR: packaged SPK still identifies itself as the development build."
              exit 1
          fi

          if find verify \( -iname '*docker*' -o -iname '*compose*' \) | grep -q .; then
              echo "ERROR: Docker/container content found in native SPK."
              exit 1
          fi

          if grep -R -E 'ContainerManager|docker-project|preload-image' verify/INFO verify/conf verify/scripts; then
              echo "ERROR: Container Manager dependency remains."
              exit 1
          fi

          python3 - <<'PY'
          import struct
          from pathlib import Path

          for name, expected in (("PACKAGE_ICON.PNG", (64, 64)), ("PACKAGE_ICON_256.PNG", (256, 256))):
              data = Path("verify", name).read_bytes()
              if data[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"{name} is not a PNG")
              width, height = struct.unpack(">II", data[16:24])
              if (width, height) != expected:
                  raise SystemExit(f"{name}: expected {expected}, got {(width, height)}")
              print(f"{name}: {width}x{height} OK")
          PY

          verify/payload/runtime/python/bin/python3 -m py_compile \
            verify/payload/smart-optimizer-supervisor.py

          grep -q \
            'SMART_OPTIMIZER_SELF_UPDATE_MODE="app-bundle"' \
            verify/scripts/start-stop-status

          grep -q \
            'SMART_OPTIMIZER_UPDATE_DIR="$VAR/updates"' \
            verify/scripts/start-stop-status

          grep -q \
            '"SMART_OPTIMIZER_UPDATE_DIR"' \
            verify/payload/smart-optimizer-supervisor.py

          grep -q \
            '"/updates?refresh=1"' \
            verify/payload/app/smart-optimizer-ui.py

          grep -q \
            'data.installed !== "__CURRENT_VERSION__"' \
            verify/payload/app/smart-optimizer-ui.py

          grep -q \
            'href="/favicon.ico?v=2"' \
            verify/payload/app/smart-optimizer-ui.py

          grep -q \
            'SmartOptimizerUI-update.json' \
            verify/payload/app/smart-optimizer-ui.py

          verify/payload/runtime/python/bin/python3 -c 'import ssl, urllib.request, http.server; print("Native runtime validation OK")'

      - name: Build update manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.version.outputs.value }}'
          APP_BUNDLE="dist/SmartOptimizerUI-App-${VERSION}.tar.gz"
          SPK="$(find dist -name '*.spk' -print -quit)"

          export VERSION APP_BUNDLE SPK

          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          app = Path(os.environ["APP_BUNDLE"])
          spk = Path(os.environ["SPK"])
          notes_path = Path(f"RELEASE-NOTES-v{version}.md")
          notes = notes_path.read_text(encoding="utf-8") if notes_path.exists() else ""

          def sha256(path):
              h = hashlib.sha256()
              with path.open("rb") as fh:
                  for chunk in iter(lambda: fh.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          base = f"https://github.com/MrRobot-88/Smart-Optimizer-UI/releases/download/v{version}"

          manifest = {
              "version": version,
              "tag": f"v{version}",
              "name": f"Smart Optimizer UI v{version}",
              "notes": notes,
              "published_at": "",
              "html_url": f"https://github.com/MrRobot-88/Smart-Optimizer-UI/releases/tag/v{version}",
              "app_asset": {
                  "name": app.name,
                  "browser_download_url": f"{base}/{app.name}",
                  "size": app.stat().st_size,
                  "digest": f"sha256:{sha256(app)}",
              },
              "spk_asset": {
                  "name": spk.name,
                  "browser_download_url": f"{base}/{spk.name}",
                  "size": spk.stat().st_size,
                  "digest": f"sha256:{sha256(spk)}",
              },
          }

          Path("dist/SmartOptimizerUI-update.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          python3 -m json.tool dist/SmartOptimizerUI-update.json >/dev/null

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SmartOptimizerUI-${{ steps.version.outputs.value }}-release-assets
          path: |
            dist/*.spk
            dist/SmartOptimizerUI-App-*.tar.gz
            dist/SmartOptimizerUI-update.json
          if-no-files-found: error

      - name: Publish v2.2.4 native GitHub Release
        if: >
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          contains(github.event.head_commit.message, '[release v2.2.4]')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SPK="$(find dist -name '*.spk' -print -quit)"
          APP_BUNDLE="$(find dist -name 'SmartOptimizerUI-App-*.tar.gz' -print -quit)"
          MANIFEST="dist/SmartOptimizerUI-update.json"
          test -n "$SPK"
          test -n "$APP_BUNDLE"
          test -s "$MANIFEST"
          TAG='v2.2.4'

          if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" "$SPK" "$APP_BUNDLE" "$MANIFEST" --clobber
          else
              gh release create "$TAG" "$SPK" "$APP_BUNDLE" "$MANIFEST" \
                --target "$GITHUB_SHA" \
                --title 'Smart Optimizer UI v2.2.4' \
                --notes-file RELEASE-NOTES-v2.2.4.md
          fi

      - name: Attach native SPK to tag release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SPK="$(find dist -name '*.spk' -print -quit)"
          APP_BUNDLE="$(find dist -name 'SmartOptimizerUI-App-*.tar.gz' -print -quit)"
          MANIFEST="dist/SmartOptimizerUI-update.json"
          test -n "$SPK"
          test -n "$APP_BUNDLE"
          test -s "$MANIFEST"
          gh release upload "$GITHUB_REF_NAME" "$SPK" "$APP_BUNDLE" "$MANIFEST" --clobber
