name: Synology Native Offline SPK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native-spk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Choose package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              VERSION="${GITHUB_REF_NAME#v}"
          else
              VERSION="2.0.3"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Smart Optimizer UI $VERSION"

      - name: Install icon build dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check "Pillow==11.3.0"

      - name: Download portable native Python runtime
        shell: bash
        run: |
          set -euo pipefail
          URL='https://github.com/astral-sh/python-build-standalone/releases/download/20260924/cpython-3.12.14%2B20260924-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz'
          curl -fL --retry 4 --retry-delay 3 "$URL" -o portable-python.tar.gz
          echo '269b2c99e4db15b242bf01832f4fea1e8f1a664f273cff519393f296e9820b41  portable-python.tar.gz' | sha256sum -c -

      - name: Build native offline SPK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./packaging/synology/build-spk.sh
          VERSION='${{ steps.version.outputs.value }}' \
          PORTABLE_PYTHON_ARCHIVE="$PWD/portable-python.tar.gz" \
          ./packaging/synology/build-spk.sh "$PWD/dist"

      - name: Validate native package
        shell: bash
        run: |
          set -euo pipefail
          SPK="$(find dist -maxdepth 1 -type f -name '*.spk' -print -quit)"
          test -n "$SPK"

          BYTES="$(wc -c < "$SPK")"
          echo "SPK size: $BYTES"
          test "$BYTES" -gt 20000000

          mkdir verify
          tar -xf "$SPK" -C verify

          for ITEM in               INFO               package.tgz               scripts/start-stop-status               conf/privilege               PACKAGE_ICON.PNG               PACKAGE_ICON_256.PNG
          do
              test -e "verify/$ITEM"
          done

          mkdir verify/payload
          tar -xzf verify/package.tgz -C verify/payload

          test -x verify/payload/runtime/python/bin/python3
          test -f verify/payload/app/smart-optimizer-ui.py
          test -f verify/payload/app/radarr-smart-optimizer.py
          test -f verify/payload/app/sonarr-smart-optimizer.py

          if find verify \( -iname '*docker*' -o -iname '*compose*' \) | grep -q .; then
              echo "ERROR: Docker/container content found in native SPK."
              exit 1
          fi

          if grep -R -E 'ContainerManager|docker-project|preload-image' verify/INFO verify/conf verify/scripts; then
              echo "ERROR: Container Manager dependency remains."
              exit 1
          fi

          python3 - <<'PY'
          import struct
          from pathlib import Path

          for name, expected in (("PACKAGE_ICON.PNG", (64, 64)), ("PACKAGE_ICON_256.PNG", (256, 256))):
              data = Path("verify", name).read_bytes()
              if data[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"{name} is not a PNG")
              width, height = struct.unpack(">II", data[16:24])
              if (width, height) != expected:
                  raise SystemExit(f"{name}: expected {expected}, got {(width, height)}")
              print(f"{name}: {width}x{height} OK")
          PY

          verify/payload/runtime/python/bin/python3 -c 'import ssl, urllib.request, http.server; print("Native runtime validation OK")'

      - name: Upload native SPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartOptimizerUI-${{ steps.version.outputs.value }}-NATIVE-OFFLINE-x86_64
          path: dist/*.spk
          if-no-files-found: error

      - name: Publish v2.0.3 native GitHub Release
        if: >
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          contains(github.event.head_commit.message, '[release v2.0.3]')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SPK="$(find dist -name '*.spk' -print -quit)"
          test -n "$SPK"
          TAG='v2.0.3'

          if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" "$SPK" --clobber
          else
              gh release create "$TAG" "$SPK" \
                --target "$GITHUB_SHA" \
                --title 'Smart Optimizer UI v2.0.3' \
                --notes-file RELEASE-NOTES-v2.0.3.md
          fi

      - name: Attach native SPK to tag release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SPK="$(find dist -name '*.spk' -print -quit)"
          test -n "$SPK"
          gh release upload "$GITHUB_REF_NAME" "$SPK" --clobber
