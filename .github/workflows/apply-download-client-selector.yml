name: Apply downloader selector patch

on:
  push:
    branches:
      - download-client-selector
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: download-client-selector

      - name: Apply patch
        run: python3 .github/scripts/apply_downloader_selector.py

      - name: Syntax checks
        run: python3 -m py_compile smart-optimizer-ui.py sonarr-smart-optimizer.py radarr-smart-optimizer.py sonarr_api_compat.py

      - name: Static selector checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('smart-optimizer-ui.py').read_text()
          for token in (
              'def download_client_settings():',
              'def sync_arr_download_client_selection(app, selected):',
              'action="/download-client-settings"',
              'if self.path == "/download-client-settings":',
              '__DOWNLOADER_CARD__',
          ):
              assert token in s, token
          print('static checks OK')
          PY

      - name: Diff check
        run: git diff --check

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No patch changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add smart-optimizer-ui.py
          git commit -m "Add Deluge and rqbit downloader selector"
          git push origin HEAD:download-client-selector
