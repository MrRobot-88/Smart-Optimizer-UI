services:
  smart-optimizer:
    build: .
    container_name: smart-optimizer
    network_mode: host
    restart: unless-stopped
    environment:
      TZ: Europe/Stockholm
      SMART_UI_HOST: 0.0.0.0
      SMART_UI_PORT: 8788
      RADARR_DAILY_SEARCH_BUDGET: 400
      SONARR_DAILY_SEARCH_BUDGET: 400
    volumes:
      - ./config:/config
      - ./data:/data
