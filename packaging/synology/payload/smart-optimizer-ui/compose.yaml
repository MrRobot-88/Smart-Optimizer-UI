services:
  smart-optimizer-ui:
    image: smart-optimizer-ui:2.0.1
    container_name: smart-optimizer-ui-spk
    network_mode: host
    restart: unless-stopped
    environment:
      TZ: Etc/UTC
      SMART_UI_HOST: 0.0.0.0
      SMART_UI_PORT: "8788"
      SMART_OPTIMIZER_CONTROL: /config/smart-optimizer-control.json
      SMART_OPTIMIZER_CONNECTIONS: /config/smart-optimizer-connections.json
      RADARR_OPTIMIZER_STATE: /data/radarr-state.json
      SONARR_OPTIMIZER_STATE: /data/sonarr-state.json
    volumes:
      - /var/packages/smartoptimizerui/var/config:/config
      - /var/packages/smartoptimizerui/var/data:/data
